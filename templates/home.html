<!DOCTYPE html>
<html lang="en">
<head>
    <title>Home Recipe Page</title>
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- display a flash message here, if necessary -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <div class="container">
        <h1 class="mt-5">Recipe Book</h1>
        <div class="mt-3">
            <!-- Add Recipe Button -->
            <a href="/add-recipe" class="btn btn-primary">Add Recipe</a>
            <!-- Delete Recipe Button -->
            <a href="/delete-recipe" class="btn btn-danger">Delete Recipe</a>
            <!-- Update Recipe Button -->
            <a href="/update-recipe" class="btn btn-secondary">Update Recipe</a>
            <!-- Display All Recipes Button -->
            <a href="/display-recipes" class="btn btn-info">Display All Recipes</a>
        </div>
    </div>
</body>
</html>
