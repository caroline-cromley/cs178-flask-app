<!doctype html>
<html lang="en">
  <head><title>Update Recipe</title></head>
  <body>
    <h1>Update Recipe Rating</h1>
    <form action="{{ url_for('update_recipe_route') }}" method="post">
      <label>Select recipe:</label><br />
      <select name="recipe_id">
        {% for r in recipes %}
          <option value="{{ r['id'] }}">{{ r['title'] }}</option> <!--Claude AI used to create a dropdown box to select the correct recipe name.-->
        {% endfor %}
      </select><br /><br />
      <label>New rating (1.0 - 5.0):</label><br />
      <input type="number" name="rating" step="0.1" min="1" max="5" required /><br /><br />
      <input type="submit" value="Update Rating" />
    </form>
  </body>
</html>
